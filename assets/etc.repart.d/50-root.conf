# Grow the root partition to fill whatever disk the artifact was dd'd onto.
#
# Installed to /etc/repart.d/50-root.conf by scripts/stage-generalize.sh.
#
# NO Device= and no device argument anywhere: systemd-repart defaults to the
# disk backing /, so this is correct on /dev/vda in the build VM and on
# /dev/sda or /dev/nvme0n1 on a switch, with no branching and no distro-specific
# detection.
#
# It matches the EXISTING root-x86-64 partition the image already carries and
# extends it (default Weight=1000, no SizeMaxBytes, so it takes all free space).
# The artifact is dd'd whole, so the GPT -- including the root partition's type
# GUID -- comes from this image; there is no host on which the match can fail
# and cause a second partition to be created instead.
[Partition]
Type=root
